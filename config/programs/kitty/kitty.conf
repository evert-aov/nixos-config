# ===========================================================
# FONTS AND TYPOGRAPHY
# ===========================================================
font_family      JetBrains Mono
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# ===========================================================
# APAREANCE AND WINDOWS
# ===========================================================
background_opacity 1.0
confirm_os_window_close 0
window_padding_width 2

# ===========================================================
# CURSOR BEHAVIOR
# ===========================================================
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ===========================================================
# SCROLL AND BUFFER
# ===========================================================
scrollback_lines 2000
wheel_scroll_min_lines 1

# ===========================================================
# SOUND AND CONFIRMATIONS
# ===========================================================
enable_audio_bell no
hide_window_decorations yes

# ===========================================================
# FREE SHORTCUTS FOR NVIM
# ===========================================================
map ctrl+tab no_op
map ctrl+shift+tab no_op

# ===========================================================
# THEMES AND IMAGES
# ===========================================================
include /tmp/kitty-matugen-colors.conf
#background_image /home/evert/Pictures/fastfetch/seris.png
#background_image_layout scaled
#background_tint 0.85

# ===========================================================
# TABS
# ===========================================================
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+page_down  next_tab
map ctrl+page_up    previous_tab

map ctrl+1  goto_tab 1
map ctrl+2  goto_tab 2
map ctrl+3  goto_tab 3
map ctrl+4  goto_tab 4
map ctrl+5  goto_tab 5
map ctrl+6  goto_tab 6
map ctrl+7  goto_tab 7
map ctrl+8  goto_tab 8
map ctrl+9  goto_tab 9

map ctrl+0  goto_tab -1

# ===========================================================
# WINDOWS LAYOUTS
# ===========================================================
enabled_layouts splits,stack

# ===========================================================
# CREATE A NEW WINDOWS
# ===========================================================
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+right  launch --location=vsplit --cwd=current
map ctrl+shift+left   launch --location=vsplit --cwd=current; move_window_backward
map ctrl+shift+down   launch --location=hsplit --cwd=current
map ctrl+shift+up     launch --location=hsplit --cwd=current; move_window_to_top

# ===========================================================
# FULLSCREEN WINDOWS
# ===========================================================
map ctrl+alt+f toggle_layout stack

# ===========================================================
# RESIZE WINDOWS
# ===========================================================
map ctrl+alt+right    resize_window wider
map ctrl+alt+left     resize_window narrower
map ctrl+alt+up       resize_window taller
map ctrl+alt+down     resize_window shorter 3

# ===========================================================
# NAVIGATE BETWEEN WINDOWS
# ===========================================================
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# ===========================================================
# MOVE WINDOWS
# ===========================================================
map shift+left   move_window left
map shift+right  move_window right
map shift+up     move_window up
map shift+down   move_window down
