# ─────────────────────────────
# Layer rules (OSD / overlays)
# ─────────────────────────────

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── CS2 ─────────
windowrule = immediate, match:class ^(cs2)$
windowrule = keepaspectratio, match:class ^(cs2)$

# ───────── App Launcher ─────────
windowrule = float, center, size 1200 600, animation slide, match:title ^(app-launcher)$

